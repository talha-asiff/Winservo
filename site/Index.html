<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live at C/C++ Server</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Animated Network Socket Canvas Background -->
    <canvas id="bg-canvas"></canvas>

    <!-- Main Content Container -->
    <div class="container">
        <main class="card">
            
            <!-- Live Status Indicator -->
            <div class="status-badge">
                <span class="pulse-dot"></span>
                <span>Live at C/C++ Server</span>
            </div>

            <!-- Header Text -->
            <h1 class="title">Winservo</h1>
            <p class="subtitle">High-Performance Socket Server Engine</p>

            <!-- Credit & Info -->
            <div class="author-tag">
                Crafted by <span class="author-name">Talha Asif</span>
            </div>

            <!-- Call to Action Buttons -->
            <div class="actions">
                <a href="https://github.com/talha-asiff" target="_blank" rel="noopener noreferrer" class="btn btn-primary">
                    <i class="fa-brands fa-github"></i>
                    <span>Visit GitHub</span>
                </a>

                <button id="star-btn" class="btn btn-secondary" onclick="handleStarClick()">
                    <i class="fa-regular fa-star" id="star-icon"></i>
                    <span id="star-text">Give it a star on GitHub</span>
                </button>
            </div>

            <!-- Toast Notification -->
            <div id="toast" class="toast">
                <i class="fa-solid fa-circle-check"></i>
                <span>Redirecting to GitHub to star...</span>
            </div>

        </main>

        <footer>
            <p>&copy; 2026 Talha Asif • Built with C/C++ Sockets & Low-Level Architecture</p>
        </footer>
    </div>

    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
